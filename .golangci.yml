version: "2"

run:
  timeout: 5m
  build-tags:
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    rules:
      # Output writes to the terminal are best effort by design of fmt.Fprint*.
      - linters: [errcheck]
        text: "Error return value of `fmt.Fprint"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/CCH-HQ/cchp-cli

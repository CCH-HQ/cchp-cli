# Risk, secret, pagination and retry policy for every CCHP operation.
#
# risk: read (agent mode runs it by default), write (needs --allow-write) or
#   destructive (also needs --confirm <operationId>). An operation missing here
#   is treated as write.
# retry: true lets cchp retry transient failures automatically; reads only.
# permission: the CCHP permission the server checks, used in plain-language errors.
# secret_fields: response fields that hold a one-time secret; the caller must
#   name a destination with --secret-out and the value never reaches stdout.
# pagination: how to walk pages (style cursor or page).
# listing: for a download, the operation that lists its parts with their sizes
#   (same path parameters except the last, which names the part); an empty
#   download of a part the listing shows as not empty fails.
version: 1
defaults:
  risk: write
operations:
  abortConfigExperiment: {risk: destructive, permission: "config:publish"}
  acceptInvitation: {risk: write}

# cchp CLI overlay for the pinned CCHP control-plane spec (OpenAPI Overlay 1.0).
#
# cmd/cchp-gen applies it to spec/upstream/control-plane.yaml, which stays exactly
# as exported. Restish's extensions name the commands:
#   x-cli-name         command name inside its group (default: kebab-case operationId)
#   x-cli-aliases      extra command names
#   x-cli-description  English one-line summary (operations) or help text (parameters)
#   x-cli-ignore       leave the operation out of the CLI; x-cchp-exclude-reason says why
# cchp adds:
#   x-cchp-group               the human command group
#   x-cchp-exclude-reason      why an ignored operation is excluded
#   x-cchp-unsupported-reason  why the CLI cannot send an operation yet
# The overlay never adds management-token support the server does not have.
overlay: 1.0.0
info:
  title: cchp CLI names and English text
  version: 1.0.0

x-cchp-groups:
  - {name: account, title: Account, summary: "Your identity, permissions, preferences and announcements."}
  - {name: tokens, title: Management tokens, summary: "Tokens that let tools like cchp manage CCHP."}
  - {name: llm-tokens, title: LLM tokens, summary: "Gateway keys that apps use to call models, including members' keys."}
  - {name: providers, title: Providers, summary: "Upstream providers, their endpoints, groups, health checks and search providers."}
  - {name: keys, title: Provider keys, summary: "Upstream credentials attached to providers."}
  - {name: requests, title: Requests, summary: "Request logs, their attempts and archived payloads."}
  - {name: usage, title: Usage, summary: "Usage totals, trends, rankings, live metrics and exports."}
  - {name: models, title: Models, summary: "The model catalog and pricing."}
  - {name: billing, title: Billing and wallet, summary: "Balances, invoices, wallet, payments, finance events and quotas."}
  - {name: org, title: Organization, summary: "Organizations, members, teams, invitations, roles and audit logs."}
  - {name: tasks, title: Tasks, summary: "Background media tasks and their result files."}
  - {name: admin, title: Platform administration, summary: "Users, organizations, system settings and diagnostics across the platform."}
  - {name: safety, title: Safety and filters, summary: "Model safety rules, moderation, privacy and request filters, error rules and client rules."}
  - {name: operations, title: Operations, summary: "Announcements, redeem codes, billing adjustments and emails sent by operators."}
  - {name: config, title: Configuration, summary: "Configuration drafts, rollout experiments, publishing and snapshots."}
  - {name: plugins, title: Plugins, summary: "Gateway plugins."}
  - {name: import, title: CC Hub import, summary: "Import users, providers and keys from a CC Hub installation."}
  - {name: public, title: Public, summary: "Health, public model catalog and status pages that need no sign-in."}
  - {name: sign-in, title: Sign-in and setup, summary: "Browser sign-in, installation and human verification flows."}

